apiVersion: v1
kind: Service
metadata:
  name: flex-docs
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "flex-backend-config"}'
spec:
  type: NodePort
  ports:
    - port: 3000
      protocol: TCP
      name: http
  selector:
    app: flex-docs